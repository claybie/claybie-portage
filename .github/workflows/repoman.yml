name: CI

on:
  push:
    branches: [ clorb ]
  pull_request:
    branches: [ clorb ]

jobs:
    repoman:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: lucianposton/repoman-ebuild-qa-action@v1
              continue-on-error: true
              with:
                repoman_args: -dI
                portage_version: latest
